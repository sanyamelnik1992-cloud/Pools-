# Бот-ребалансер пулов SUI/USDC на Cetus — бумажный и тестовый режимы (ключи и деньги не нужны).
# Все стратегии ведутся параллельно на одних и тех же данных пула и сравниваются с двумя вариантами:
#   «холд SUI»     — просто держать стартовые SUI;
#   «та же доля»   — обменять ту же долю SUI на USDC, что ушла в пул, и просто держать (вклад самого пула).
# Главная метрика для накопления — SUI-эквивалент: стоимость позиции в штуках SUI по текущей цене.

poll_seconds = 30          # как часто читать пул
snapshot_minutes = 15      # как часто писать снимок в snapshots.csv
report_hour_utc = 6        # ежедневный отчёт в Telegram (если заданы TG_TOKEN и TG_CHAT)
staking_apy = 0.014        # стейкинг SUI у валидаторов — ориентир, сколько SUI можно получить без риска
state_dir = "data/private/bot"

[costs]
swap_fee = 0.0005          # комиссия маршрута при обмене во время пересборки
slippage = 0.0005          # проскальзывание
gas_sui = 0.02             # газ на одну пересборку (снять, обменять, добавить), SUI

[live]                     # боевой режим: python3 bot.py live
strategy = "оптимальная ±4%, выходы по тренду"   # какая стратегия из списка ниже ведётся на реальные деньги
max_capital_usd = 200      # бот берёт из кошелька не больше этой суммы (SUI + USDC)
gas_reserve_sui = 1.0      # столько SUI всегда остаётся в кошельке на газ
slippage = 0.005           # допустимое проскальзывание обмена через агрегатор (0.5%)
price_band = 0.001         # запас на сдвиг цены, пока открывается или закрывается позиция (0.1%)
min_swap_usd = 1.0         # обмены меньше этой суммы не делаются
dry_run = false            # true — только симуляция, ничего не отправляется; false — реальные транзакции
# address = "0x…"          # адрес кошелька для проверки симуляцией без ключа (в dry_run)
report_hours = 4           # отчёт в Telegram каждые 4 часа: позиция, заработок, итог (0 — только утренний)
gas_warn_sui = 0.5         # предупредить в Telegram, если SUI в кошельке (на газ) меньше этого
reinvest_days = 7          # раз в 7 дней: забрать комиссии и награды, CETUS → SUI, всё добавить в позицию (0 — нет)
reward_min_usd = 1.0       # награды дешевле $1 не меняются: газ и проскальзывание съедят больше
reinvest_min_usd = 2.0     # меньше $2 в позицию не добавляется — копится до следующего раза
price_check_pct = 0.01     # не действовать, если цена пула расходится с Binance больше чем на 1% (выброс, сбой узла)
lag_warn_pct = 0.05        # предупредить, если за 7 дней бот отстал от «держать SUI» больше чем на 5%
strategy_check_days = 7    # раз в 7 дней бэктест всех стратегий на свежих ценах с подсказкой (0 — не проверять)

[pools.cetus_025]          # Cetus USDC/SUI 0.25%, шаг тиков 60 (~0.6%) — самый глубокий пул
object = "0xb8d7d9e66a60c239e7a60110efcf8de6c705580ed924d0dde141f4a0e2c90105"
dex = "cetus"
a_is_sui = false

[pools.cetus_005]          # Cetus USDC/SUI 0.05%, шаг тиков 10 (~0.1%) — для узких диапазонов
object = "0x51e883ba7c0b566a26cbc8a94cd33eb0abd418a77cc1e60ad22fd9b1f29cd2ab"
dex = "cetus"
a_is_sui = false

# Параметры стратегии:
#   capital_sui        стартовый капитал в SUI (нужная доля меняется на USDC при открытии)
#   range_down/up      границы диапазона от цены: цена × (1 − down) … цена × (1 + up)
#   initial_range      первая позиция в $ за SUI, например [1.20, 1.30]; дальше — range_down/up
#   rebalance          both — пересобирать в обе стороны; down — только когда цена ниже
#                      (выше всё уже продано в USDC — так и остаётся); up — только вверх; none — никогда
#   out_minutes        сколько минут цена должна пробыть вне диапазона до пересборки
#   cooldown_minutes   пауза после пересборки;  max_per_day — не больше пересборок за сутки
#   stop_vs_split_pct  прекратить пересборки, если пул отстал от «той же доли» на столько %
#   rally_exit         выйти в 100% SUI на сильном росте: [[часов, рост], ...] — например [[72, 0.15]]:
#                      цена выросла на 15% от минимума за последние 72 часа
#   resume_drop_pct    вернуться в пул, когда цена упадёт на столько от пика после выхода;
#                      не задано — после выхода бот больше не работает и просто держит SUI
#   crash_exit         выйти в 100% USDC на сильном падении: [[72, 0.15]] — цена упала на 15% от максимума
#                      за последние 72 часа
#   resume_rise_pct    вернуться в пул, когда цена поднимется на столько от минимума после выхода в USDC
#   trend_ma_days      фильтр глобального тренда: выход в SUI — только если цена выше средней за N дней, в USDC —
#                      только если ниже; против тренда бот остаётся в пуле (не задано — выходы без фильтра)
#
# «оптимальная ±4%» выбрана перебором 192 вариантов и проверкой финалистов на новых тестах (python3 bot.py
# optimize): в плюсе к «той же доле» во всех 8 исходных тестах, лучшая по худшему случаю и при издержках ×3.


[[strategy]]
name = "оптимальная ±4%"                 # основная: узкий диапазон + выходы в SUI на росте и в USDC на падении
pool = "cetus_005"
capital_sui = 3370
range_down = 0.04
range_up = 0.04
out_minutes = 180                        # пересборка, если цена 3 часа вне диапазона (не дёргается на шуме)
rally_exit = [[72, 0.15]]
resume_drop_pct = 0.10
crash_exit = [[72, 0.15]]
resume_rise_pct = 0.10

[[strategy]]
name = "оптимальная ±4%, выходы по тренду"  # то же + фильтр глобального тренда: выход в SUI только выше средней
pool = "cetus_005"                          # за 50 дней, в USDC — только ниже (отскоки и провалы против тренда бот
capital_sui = 3370                          # пережидает в пуле); на истории лучше и в среднем, и в худшем случае
range_down = 0.04
range_up = 0.04
out_minutes = 180
rally_exit = [[72, 0.15]]
resume_drop_pct = 0.10
crash_exit = [[72, 0.15]]
resume_rise_pct = 0.10
trend_ma_days = 50

